# Local PostgreSQL for Rail (development). Production: managed RDS / Cloud SQL + TLS.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail_dev_password
      POSTGRES_DB: rail
    ports:
      - "5432:5432"
    volumes:
      - rail_pg_data:/var/lib/postgresql/data

volumes:
  rail_pg_data:
