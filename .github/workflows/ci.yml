name: Rail CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rail
          POSTGRES_PASSWORD: rail_ci_password
          POSTGRES_DB: rail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rail -d rail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rail:rail_ci_password@localhost:5432/rail
      JWT_SECRET: ci_jwt_secret_012345678901234567890123456789
      RAIL_SIGNING_SECRET: ci_signing_secret_012345678901234567890123456789
      RAIL_API_KEY: ci_api_key_012345678901234567890123456789
      RAIL_API_KEY_SCOPES: offline_tokens:issue,sync:write
      RAIL_ALLOWED_ORIGINS: http://localhost:3000
      RAIL_RUNTIME: serverless
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run full test suite
        run: npm test
      - name: Run hardening tests explicitly
        run: node --test test/hardening.test.js
      - name: Verify event delivery and stream lifecycle
        run: node --test test/events.test.js
      - name: Verify request deadlines and bounded diagnostic stores
        run: node --test test/resources.test.js
      - name: Verify authentication and existing shadow-risk and audit regressions
        run: node --test test/authRoutes.test.js test/risk.test.js test/auditCommitment.test.js
